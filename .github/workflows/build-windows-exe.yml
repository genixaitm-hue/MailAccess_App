name: Build Windows Desktop App Executable (.exe)

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Tauri Desktop Executable (.exe / .msi)
        run: |
          cd frontend
          npx tauri build

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MailAccess-Windows-Desktop-v0.14.3
          path: |
            frontend/src-tauri/target/release/bundle/msi/*.msi
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/mailaccess-desktop.exe
